<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 02</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form>
        <h1>Outros controles de formulário</h1>

        <input type="hidden" name="acao" value="atualizar">
        <input type="hidden" name="id" value="123">
        <h2>Tipo Radio</h2>

        <input type="radio" id="vermelho" name="cor" value="vermelho" checked>
        <label for="vermelho">Vermelho</label><br>

        <input type="radio" id="azul" name="cor" value="azul" checked>
        <label for="azul">Azul</label><br>

        <input type="radio" id="verde" name="cor" value="verde" checked>
        <label for="verde">Verde (Padrão)</label><br>
        <hr>
        <h2>Tipo Checkbox</h2>
        <p>Selecione suas tecnologias favoritas:</p>

        <input type="checkbox" id="html" name="tecnologia" value="html">
        <label for="html">HTML</label><br>

        <input type="checkbox" id="css" name="tecnologia" value="css">
        <label for="css">CSS</label><br>

        <input type="checkbox" id="js" name="tecnologia" value="js">
        <label for="js">JavaScript</label><br>
        <hr>
        <input type="submit" value="Envia" class="button">
        <input type="reset" value="Limpar" class="button">

    </form>
    
</body>
</html>
